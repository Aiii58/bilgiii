<style>
:root{
  --bg:#0A0A14; --bg-soft:#0E0E1B; --card:#12121F; --card-2:#181829;
  --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.12);
  --txt:#EDEDF5; --txt-2:#9A9AB5; --txt-3:#63637E;
  --accent:#7C5CFF; --accent-soft:rgba(124,92,255,.18);
  --pink:#FF6B9D; --pink-2:#FF9EC0;
  --yellow:#FFD84D; --green:#10D9A0; --red:#FF6B6B;
  --r:20px;
}
html[data-tema="light"]{
  --bg:#F4F4FA; --bg-soft:#EDEDF6; --card:#FFFFFF; --card-2:#F6F6FC;
  --line:rgba(20,20,50,.08); --line-2:rgba(20,20,50,.16);
  --txt:#171730; --txt-2:#5C5C7A; --txt-3:#8B8BA6;
  --accent-soft:rgba(124,92,255,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--txt);
  font-family:Quicksand,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  font-weight:500; min-height:100vh;
  padding:max(14px,env(safe-area-inset-top)) 14px max(24px,env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:600px;margin:0 auto}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer;border:none;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

/* ---------- üst bölüm ---------- */
.tema-btn{
  display:block;margin-left:auto;width:64px;height:64px;border-radius:18px;
  border:1px solid var(--line-2);background:var(--card);font-size:28px;line-height:1;
  transition:transform .15s, background .2s;
}
.tema-btn:active{transform:scale(.93)}
h1{
  font-family:"Baloo 2",Quicksand,sans-serif;font-weight:800;font-size:34px;
  text-align:center;margin:14px 0 0;letter-spacing:.3px;
  background:linear-gradient(100deg,var(--pink),var(--pink-2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
h1 .brain{-webkit-text-fill-color:initial;color:initial;font-size:28px;vertical-align:2px}
.sayaclar{display:flex;justify-content:center;gap:6px;margin:14px 0 18px}
.sayac{flex:1;max-width:82px;text-align:center}
.sayac b{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:26px;height:30px;padding:0 7px;border-radius:9px;
  border:1.5px solid var(--accent);color:var(--accent);
  font-family:"Baloo 2",sans-serif;font-size:19px;font-weight:700;
}
.sayac.sari b{border-color:var(--yellow);color:var(--yellow)}
.sayac span{display:block;margin-top:5px;font-size:11px;letter-spacing:1px;color:var(--txt-3);font-weight:700}

/* ---------- sekmeler ---------- */
.sekmeler{
  display:flex;gap:4px;padding:8px;border-radius:24px;
  border:1px solid var(--line);background:var(--card);margin-bottom:16px;
}
.sekme{
  flex:1;padding:12px 2px 10px;border-radius:16px;text-align:center;
  color:var(--txt-2);font-size:12.5px;font-weight:600;transition:background .18s,color .18s;
}
.sekme i{display:block;font-style:normal;font-size:26px;margin-bottom:5px;line-height:1;filter:grayscale(.35)}
.sekme[aria-selected="true"]{background:var(--accent);color:#fff}
.sekme[aria-selected="true"] i{filter:none}

/* ---------- ortak parçalar ---------- */
.kart{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}
.satir{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.alan{
  flex:1;min-width:0;background:transparent;border:1px solid var(--line-2);
  border-radius:16px;padding:14px 16px;color:var(--txt);
}
.alan::placeholder{color:var(--txt-3)}
select.alan{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--txt-2) 50%),linear-gradient(135deg,var(--txt-2) 50%,transparent 50%);background-position:calc(100% - 20px) 22px,calc(100% - 15px) 22px;background-size:5px 5px;background-repeat:no-repeat;padding-right:40px}
.ara-kutu{position:relative;flex:1.6;min-width:180px}
.ara-kutu .alan{padding-left:44px;width:100%}
.ara-kutu::before{content:"🔍";position:absolute;left:15px;top:13px;font-size:15px;opacity:.7}
label.etiket{display:block;font-size:11.5px;letter-spacing:1.1px;font-weight:700;color:var(--txt-3);margin:16px 0 8px}
.bos{text-align:center;padding:70px 20px;color:var(--txt-3);font-size:17px;line-height:1.7}
.bos i{display:block;font-style:normal;font-size:52px;margin-bottom:18px;opacity:.85}
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  padding:16px;border-radius:16px;background:var(--accent);color:#fff;
  font-size:16px;font-weight:700;transition:transform .12s,filter .2s;
}
.btn:active{transform:scale(.98)}
.btn.sari{background:var(--yellow);color:#2A2005}
.btn.kirmizi{background:var(--red);color:#3A0B0B;width:auto;padding:14px 22px}
.btn.bos-cerceve{background:transparent;border:1px solid var(--line-2);color:var(--txt)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ikili{display:flex;gap:10px}
.ikili .btn{flex:1}

/* ---------- ekle: mod seçici ---------- */
.mod-secici{display:flex;gap:10px;margin-bottom:14px}
.mod{flex:1;padding:15px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--txt-2);font-weight:700;font-size:15px}
.mod[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.baslik{font-size:19px;font-weight:700;font-family:"Baloo 2",sans-serif;margin:0 0 4px}

/* ---------- şık girişleri ---------- */
.sik-satir{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.harf{
  flex:none;width:44px;height:44px;border-radius:50%;background:var(--card-2);
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
  font-weight:700;color:var(--txt-2);font-size:15px;
}
.radyo{
  flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line-2);
  display:flex;align-items:center;justify-content:center;transition:border-color .2s;
}
.radyo[aria-checked="true"]{border-color:var(--green)}
.radyo[aria-checked="true"]::after{content:"";width:13px;height:13px;border-radius:50%;background:var(--green)}

/* ---------- soru listesi ---------- */
.soru-kart{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px 16px;margin-bottom:11px}
.soru-ust{display:flex;align-items:center;gap:7px;margin-bottom:9px;flex-wrap:wrap}
.rozet{font-size:11px;font-weight:700;padding:4px 10px;border-radius:8px;background:var(--card-2);color:var(--txt-2);letter-spacing:.3px}
.rozet.mor{background:var(--accent-soft);color:var(--accent)}
.soru-kart p{margin:0;font-size:15.5px;line-height:1.5;font-weight:600}
.cevap-sat{margin-top:9px;font-size:13.5px;color:var(--green);font-weight:600}
.soru-alt{display:flex;gap:6px;margin-top:12px;justify-content:flex-end}
.mini{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card-2);font-size:16px;display:flex;align-items:center;justify-content:center;transition:transform .12s}
.mini:active{transform:scale(.9)}
.yildiz-serit{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:16px;flex-wrap:wrap}
.yildiz-serit b{font-size:17px;font-family:"Baloo 2",sans-serif}
.pilav{background:rgba(255,216,77,.15);color:var(--yellow);font-weight:700;padding:4px 12px;border-radius:20px;font-size:13px}
.yildiz-serit .btn{width:auto;margin-left:auto;padding:13px 18px;font-size:14.5px}

/* ---------- aktar ---------- */
.aktar-sat{display:flex;align-items:center;gap:15px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;text-align:left}
.aktar-sat .ikon{flex:none;width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px;background:var(--card-2);border:1px solid var(--line)}
.aktar-sat b{display:block;font-size:17px;font-family:"Baloo 2",sans-serif;font-weight:700}
.aktar-sat span{font-size:13.5px;color:var(--txt-3)}
.uyari{border-color:rgba(255,107,107,.3)}
.uyari .baslik{color:var(--yellow)}

/* ---------- yarışma ---------- */
.oyun-ust{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.oyun-ust .mini{width:44px;height:44px;font-size:18px}
.ilerleme{flex:1;height:8px;border-radius:4px;background:var(--card-2);overflow:hidden}
.ilerleme i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--pink));transition:width .35s}
.skor{font-family:"Baloo 2",sans-serif;font-weight:700;font-size:15px;white-space:nowrap}
.soru-metni{font-size:21px;line-height:1.45;font-weight:700;margin:6px 0 4px;font-family:"Baloo 2",sans-serif}
.sik{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  padding:15px;border-radius:16px;border:1px solid var(--line-2);background:var(--card);
  margin-bottom:11px;font-size:16px;font-weight:600;transition:transform .12s,border-color .2s,background .2s;
}
.sik:active{transform:scale(.99)}
.sik[data-durum="dogru"]{border-color:var(--green);background:rgba(16,217,160,.14)}
.sik[data-durum="yanlis"]{border-color:var(--red);background:rgba(255,107,107,.14)}
.sik[data-durum="solgun"]{opacity:.4}
.gizli-cevap{background:var(--card-2);border:1px dashed var(--line-2);border-radius:16px;padding:18px;text-align:center;font-size:18px;font-weight:700;color:var(--green);margin-bottom:12px}
.neden-kutu{
  background:var(--card-2);border:1px solid var(--line-2);border-left:4px solid var(--yellow);
  border-radius:14px;padding:16px 18px;margin-top:10px;font-size:15.5px;line-height:1.6;color:var(--txt-2);font-weight:500;
}
.neden-sat{margin-top:9px;font-size:13.5px;color:var(--txt-3);line-height:1.5;font-weight:500}
.sonuc-yuzde{font-family:"Baloo 2",sans-serif;font-size:56px;font-weight:800;text-align:center;line-height:1;background:linear-gradient(100deg,var(--accent),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.sonuc-alt{text-align:center;color:var(--txt-2);margin:10px 0 22px;font-weight:600}
.ses-serit{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card-2);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.ses-ad{flex:1;min-width:100px;font-size:14px;color:var(--txt-2);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ipuc{font-size:13px;color:var(--txt-3);margin:10px 2px 0;line-height:1.5}
.cal-btn{background:linear-gradient(100deg,var(--accent),var(--pink));color:#fff;border:none}
.ortu{
  position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.66);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:22px;
}
.onay-kutu{
  background:var(--card);border:1px solid var(--line-2);border-radius:var(--r);
  padding:24px 22px;max-width:400px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.5);
}
.onay-kutu p{margin:0 0 20px;font-size:16.5px;line-height:1.55;font-weight:600}
.toast{
  position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);
  background:var(--card-2);border:1px solid var(--line-2);color:var(--txt);
  padding:13px 22px;border-radius:14px;font-weight:600;font-size:14.5px;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:50;
  box-shadow:0 10px 40px rgba(0,0,0,.4);max-width:88vw;text-align:center;
}
.toast.gor{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div id="cerceve"></div>
  <div id="icerik"></div>
</div>
<div class="toast" id="toast"></div>
<input type="file" id="dosya" accept=".json,application/json" hidden>
<input type="file" id="sesDosya" hidden>

<script>
"use strict";

/* ============================================================
   1. DEPOLAMA  (IndexedDB, erişilemezse bellek yedeği)
   ============================================================ */
const DB_ADI="bilgi-yarismasi", DEPO="sorular";
let db=null, bellek=[], depoTipi="Bellek";

function dbAc(){
  return new Promise(res=>{
    let bitti=false;
    const tamam=v=>{if(!bitti){bitti=true;res(v)}};
    setTimeout(()=>tamam(null),2500);            // sandbox'ta askıda kalmasın
    try{
      const istek=indexedDB.open(DB_ADI,1);
      istek.onupgradeneeded=e=>{
        const d=e.target.result;
        if(!d.objectStoreNames.contains(DEPO)) d.createObjectStore(DEPO,{keyPath:"id"});
      };
      istek.onsuccess=e=>{db=e.target.result;depoTipi="IndexedDB";tamam(db)};
      istek.onerror=()=>tamam(null);
      istek.onblocked=()=>tamam(null);
    }catch(e){tamam(null)}
  });
}
const magaza=mod=>db.transaction(DEPO,mod).objectStore(DEPO);
function hepsiniGetir(){
  if(!db) return Promise.resolve(bellek.slice());
  return new Promise(res=>{const r=magaza("readonly").getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>res([])});
}
function kaydet(o){
  if(!db){const i=bellek.findIndex(x=>x.id===o.id);i<0?bellek.push(o):bellek[i]=o;return Promise.resolve()}
  return new Promise(res=>{const r=magaza("readwrite").put(o);r.onsuccess=r.onerror=()=>res()});
}
function sil(id){
  if(!db){bellek=bellek.filter(x=>x.id!==id);return Promise.resolve()}
  return new Promise(res=>{const r=magaza("readwrite").delete(id);r.onsuccess=r.onerror=()=>res()});
}
function hepsiniSil(){
  if(!db){bellek=[];return Promise.resolve()}
  return new Promise(res=>{const r=magaza("readwrite").clear();r.onsuccess=r.onerror=()=>res()});
}

/* ============================================================
   2. DURUM
   ============================================================ */
const TIPLER={sikli:{ad:"Şıklı",ikon:"📝"},sesli:{ad:"Sesli",ikon:"🔊"}};
let sorular=[];
const D={
  sekme:"sorular", ara:"", tipSuz:"tumu", katSuz:"tumu",
  ekleMod:"tekli", duzenlenen:null,
  taslak:{tip:"sikli",kategori:"",soru:"",secenekler:["","","",""],dogru:0,cevap:"",aciklama:"",ses:"",sesAd:"",sesBoyut:0},
  oyun:null,
  ayar:{adet:10,tip:"tumu",kategori:"tumu",karistir:true,sadeceYildizli:false,ses:true,oku:false}
};

const $=s=>document.querySelector(s);
const kacis=t=>String(t==null?"":t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function duzelt(m){
  m=String(m==null?"":m);
  if(/%[0-9A-Fa-f]{2}/.test(m)){ try{ m=decodeURIComponent(m.replace(/\+/g," ")) }catch(e){} }
  return m.replace(/[\u2018\u2019]/g,"'").replace(/[\u201C\u201D]/g,'"').trim();
}
const yeniId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
let toastZaman;
function bildir(m){
  const t=$("#toast");t.textContent=m;t.classList.add("gor");
  clearTimeout(toastZaman);toastZaman=setTimeout(()=>t.classList.remove("gor"),2400);
}
function onay(mesaj,etiket){
  return new Promise(res=>{
    const k=document.createElement("div");
    k.className="ortu";
    k.innerHTML=`<div class="onay-kutu"><p>${kacis(mesaj)}</p>
      <div class="ikili">
        <button class="btn bos-cerceve" data-onay="0">Vazgeç</button>
        <button class="btn kirmizi" data-onay="1" style="width:100%">${kacis(etiket||"Sil")}</button>
      </div></div>`;
    document.body.appendChild(k);
    const kapat=v=>{k.remove();res(v)};
    k.querySelectorAll("[data-onay]").forEach(b=>b.onclick=()=>kapat(b.dataset.onay==="1"));
    k.onclick=e=>{if(e.target===k) kapat(false)};
  });
}
function tema(){
  let t="dark";
  try{t=localStorage.getItem("by-tema")||"dark"}catch(e){}
  document.documentElement.dataset.tema=t;
  return t;
}
function temaDegistir(){
  const y=document.documentElement.dataset.tema==="dark"?"light":"dark";
  document.documentElement.dataset.tema=y;
  try{localStorage.setItem("by-tema",y)}catch(e){}
  $('meta[name="theme-color"]').content=y==="dark"?"#0A0A14":"#F4F4FA";
  ciz();
}
const kategoriler=()=>[...new Set(sorular.map(s=>s.kategori).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"tr"));
/* --- ses efektleri (Web Audio, kayıt dosyası gerekmez) --- */
let sesCtx=null;
function sesAc(){
  try{
    if(!sesCtx) sesCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(sesCtx.state==="suspended") sesCtx.resume();
  }catch(e){sesCtx=null}
  return sesCtx;
}
function ton(frek,gecikme,sure,tip,yukseklik){
  const c=sesAc(); if(!c) return;
  const t=c.currentTime+gecikme;
  const o=c.createOscillator(), g=c.createGain();
  o.type=tip||"sine";
  o.frequency.setValueAtTime(frek,t);
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(yukseklik||.18,t+.015);
  g.gain.exponentialRampToValueAtTime(.0001,t+sure);
  o.connect(g); g.connect(c.destination);
  o.start(t); o.stop(t+sure+.05);
}
function sesDogru(){
  if(!D.ayar.ses) return;
  ton(659.25,0,.15,"triangle",.16);    // mi
  ton(830.61,.11,.15,"triangle",.16);  // sol#
  ton(987.77,.22,.5,"triangle",.2);    // si
}
function sesYanlis(){
  if(!D.ayar.ses) return;
  ton(207.65,0,.28,"sawtooth",.13);
  ton(155.56,.16,.5,"sawtooth",.13);
}
const SES_TURU={mp3:"audio/mpeg",mpeg:"audio/mpeg",m4a:"audio/mp4",mp4:"audio/mp4",aac:"audio/aac",
  wav:"audio/wav",wave:"audio/wav",ogg:"audio/ogg",oga:"audio/ogg",opus:"audio/ogg",
  flac:"audio/flac",weba:"audio/webm",webm:"audio/webm",caf:"audio/x-caf",amr:"audio/amr"};
const blobKes=new Map();
function sesUrl(veri){
  if(!veri) return "";
  if(/^(blob:|https?:)/.test(veri)) return veri;
  if(blobKes.has(veri)) return blobKes.get(veri);
  try{
    const virgul=veri.indexOf(",");
    const bas=veri.slice(0,virgul), b64=veri.slice(virgul+1);
    let tur=(bas.match(/^data:([^;]+)/)||[])[1]||"";
    if(!/^audio\/|^video\//.test(tur)) tur="audio/mpeg";
    const ham=atob(b64);
    const dizi=new Uint8Array(ham.length);
    for(let i=0;i<ham.length;i++) dizi[i]=ham.charCodeAt(i);
    const url=URL.createObjectURL(new Blob([dizi],{type:tur}));
    blobKes.set(veri,url);
    return url;
  }catch(e){ return veri; }
}
let calanSes=null, calanKaynak=null, aktifBtn=null, aktifEtiket="", aktifVeri="", nesil=0;

function b64Dizi(veri){
  const ham=atob(veri.slice(veri.indexOf(",")+1));
  const d=new Uint8Array(ham.length);
  for(let i=0;i<ham.length;i++) d[i]=ham.charCodeAt(i);
  return d;
}
function dugmeyiSalive(){ if(aktifBtn) aktifBtn.textContent=aktifEtiket; aktifBtn=null; aktifVeri=""; }
function sesiDurdur(){
  nesil++;                       // devam eden tüm işlemleri geçersiz kıl
  if(calanKaynak){ try{calanKaynak.onended=null;calanKaynak.stop();calanKaynak.disconnect()}catch(e){} calanKaynak=null; }
  if(calanSes){ try{calanSes.pause();calanSes.src=""}catch(e){} calanSes=null; }
  dugmeyiSalive();
}
function sesOynat(veri,btn){
  const ayni = aktifVeri && aktifVeri===veri;
  sesiDurdur();
  if(ayni) return;
  if(!veri) return bildir("Bu soruda ses yok.");
  sesAc();                       // dokunma anında ses motorunu uyandır
  aktifBtn=btn; aktifEtiket=btn?btn.textContent:""; aktifVeri=veri;
  if(btn) btn.textContent="⏸️ Durdur";
  const benim=nesil;             // bu çalma denemesinin kimliği

  const kaynaklar=[sesUrl(veri)];
  if(kaynaklar[0]!==veri) kaynaklar.push(veri);
  let i=0;
  function sonraki(){
    if(benim!==nesil) return;
    if(i<kaynaklar.length) elemanDene(kaynaklar[i++]); else webAudioDene(veri,benim);
  }
  function elemanDene(src){
    const a=new Audio(); calanSes=a;
    a.preload="auto"; a.playsInline=true; a.src=src;
    a.onended=()=>{ if(benim===nesil&&calanSes===a){ calanSes=null; dugmeyiSalive(); } };
    a.onerror=()=>{ if(benim===nesil&&calanSes===a){ calanSes=null; sonraki(); } };
    a.play().catch(()=>{ if(benim===nesil&&calanSes===a){ calanSes=null; sonraki(); } });
  }
  sonraki();
}
// Medya öğesi engellenirse: sesi ham veriden çöz ve Web Audio ile çal
function webAudioDene(veri,benim){
  const c=sesAc();
  if(!c || !/^data:/.test(veri)) return sesHatasi(benim);
  let ham;
  try{ ham=b64Dizi(veri).buffer }catch(e){ return sesHatasi(benim) }
  let baslatildi=false;
  const basla=buf=>{
    if(baslatildi||benim!==nesil) return;   // arada Durdur'a basıldıysa başlatma
    baslatildi=true;
    try{
      const k=c.createBufferSource();
      k.buffer=buf; k.connect(c.destination);
      k.onended=()=>{ if(benim===nesil&&calanKaynak===k){ calanKaynak=null; dugmeyiSalive(); } };
      k.start(); calanKaynak=k;
    }catch(e){ sesHatasi(benim) }
  };
  const hata=()=>sesHatasi(benim);
  try{
    const sonuc=c.decodeAudioData(ham,basla,hata);
    if(sonuc&&sonuc.then) sonuc.then(basla).catch(hata);
  }catch(e){ hata() }
}
function sesHatasi(benim){
  if(benim!==undefined&&benim!==nesil) return;
  dugmeyiSalive();
  bildir("Ses bu pencerede çalınamıyor. Dosyayı indirip kendi tarayıcınızda veya sitenizde açın.");
}
function konus(metin){
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(metin);
    u.lang="tr-TR";u.rate=.95;
    speechSynthesis.speak(u);
  }catch(e){bildir("Bu cihazda sesli okuma yok.")}
}

/* ============================================================
   3. ÇERÇEVE (başlık + sayaçlar + sekmeler)
   ============================================================ */
const SEKMELER=[
  {id:"sorular",ad:"Sorular",ikon:"📋"},
  {id:"yildizli",ad:"Yıldızlı",ikon:"⭐"},
  {id:"ekle",ad:"Ekle",ikon:"➕"},
  {id:"yarisma",ad:"Yarışma",ikon:"🎮"},
  {id:"aktar",ad:"Aktar",ikon:"💾"}
];
function cerceveCiz(){
  const say={
    toplam:sorular.length,
    sikli:sorular.filter(s=>s.tip==="sikli").length,
    sessiz:sorular.filter(s=>s.tip==="sesli"&&!s.ses).length,
    sesli:sorular.filter(s=>s.tip==="sesli"||s.ses).length,
    yildizli:sorular.filter(s=>s.yildizli).length
  };
  $("#cerceve").innerHTML=`
    <button class="tema-btn" id="temaBtn" aria-label="Temayı değiştir">${document.documentElement.dataset.tema==="dark"?"🌙":"☀️"}</button>
    <h1><span class="brain">🧠</span> Bilgi Yarışması</h1>
    <div class="sayaclar">
      <div class="sayac"><b>${say.toplam}</b><span>TOPLAM</span></div>
      <div class="sayac"><b>${say.sikli}</b><span>ŞIKLI</span></div>
      <div class="sayac"><b>${say.sessiz}</b><span>SES BEKLİYOR</span></div>
      <div class="sayac"><b>${say.sesli}</b><span>SESLİ</span></div>
      <div class="sayac sari"><b>${say.yildizli}</b><span>YILDIZLI</span></div>
    </div>
    <div class="sekmeler" role="tablist">
      ${SEKMELER.map(s=>`<button class="sekme" role="tab" data-sekme="${s.id}" aria-selected="${D.sekme===s.id}"><i>${s.ikon}</i>${s.ad}</button>`).join("")}
    </div>`;
  $("#temaBtn").onclick=temaDegistir;
  document.querySelectorAll("[data-sekme]").forEach(b=>b.onclick=()=>{D.sekme=b.dataset.sekme;ciz()});
}

/* ============================================================
   4. SEKME: SORULAR
   ============================================================ */
function soruKarti(s){
  const cevap=s.tip==="sikli"?s.secenekler[s.dogru]:s.cevap;
  return `<div class="soru-kart">
    <div class="soru-ust">
      <span class="rozet">${TIPLER[s.tip].ikon} ${TIPLER[s.tip].ad}</span>
      ${s.kategori?`<span class="rozet mor">${kacis(s.kategori)}</span>`:""}
      ${s.ses&&s.tip!=="sesli"?`<span class="rozet">🔊 Sesli</span>`:""}
      ${s.tip==="sesli"&&!s.ses?`<span class="rozet" style="color:var(--yellow)">ses eklenmedi</span>`:""}
    </div>
    <p>${kacis(s.soru)}</p>
    ${cevap?`<div class="cevap-sat">✓ ${kacis(cevap)}</div>`:""}
    ${s.aciklama?`<div class="neden-sat">💡 ${kacis(s.aciklama)}</div>`:""}
    <div class="soru-alt">
      <button class="mini" data-yildiz="${s.id}" aria-label="Yıldızla">${s.yildizli?"⭐":"☆"}</button>
      <button class="mini" data-duzenle="${s.id}" aria-label="Düzenle">✏️</button>
      <button class="mini" data-sil="${s.id}" aria-label="Sil">🗑️</button>
    </div>
  </div>`;
}
function sorularCiz(){
  const ara=D.ara.toLocaleLowerCase("tr");
  const liste=sorular.filter(s=>
    (D.tipSuz==="tumu"||(D.tipSuz==="sesli"?(s.tip==="sesli"||!!s.ses):s.tip===D.tipSuz))&&
    (D.katSuz==="tumu"||s.kategori===D.katSuz)&&
    (!ara||s.soru.toLocaleLowerCase("tr").includes(ara)||(s.cevap||"").toLocaleLowerCase("tr").includes(ara)||(s.secenekler||[]).join(" ").toLocaleLowerCase("tr").includes(ara))
  ).reverse();

  return `<div class="satir">
      <div class="ara-kutu"><input class="alan" id="araAlan" placeholder="Soru ara..." value="${kacis(D.ara)}"></div>
      <select class="alan" id="tipSuz" style="flex:.9;min-width:120px">
        <option value="tumu">Tümü</option>
        ${Object.entries(TIPLER).map(([k,v])=>`<option value="${k}" ${D.tipSuz===k?"selected":""}>${v.ad}</option>`).join("")}

function taslagiTopla(){
  const g=(id,anahtar)=>{const e=$(id); if(e) D.taslak[anahtar]=duzelt(e.value)};
  g("#katAlan","kategori"); g("#soruAlan","soru"); g("#nedenAlan","aciklama");
  document.querySelectorAll("[data-sik]").forEach(i=>D.taslak.secenekler[+i.dataset.sik]=duzelt(i.value));
  // yapıştırılan hazır satırı tanı: | varsa şıklı, :: varsa sesli
  const t=D.taslak;
  let m=t.soru.replace(/^\s*ses\s*:\s*/i,"").trim();
  const p=m.split("|").map(x=>x.trim());
  if(p.length>=6&&p[5]){
    t.tip="sikli";
    t.soru=p[0];
    t.secenekler=[p[1],p[2],p[3],p[4]];
    const harf=p[5].toLocaleUpperCase("tr").charAt(0);
    const yer=["A","B","C","D"].indexOf(harf);
    t.dogru=yer<0?0:yer;
    if(p[6]) t.kategori=p[6];
    if(p[7]) t.aciklama=p.slice(7).join(" | ");
    t.cevap="";
  }else if(m.includes("::")&&(t.tip==="sesli"||t.secenekler.every(x=>!x))){
    t.tip="sesli";
    const [sol,...kalan]=m.split("::");
    t.soru=sol.trim();
    t.cevap=kalan.join("::").split("|")[0].trim();
    t.secenekler=["","","",""];
  }else if(t.tip==="sesli"){
    t.soru=m;
  }
}

}
function taslagiSifirla(){
  D.taslak={tip:D.taslak.tip,kategori:D.taslak.kategori,soru:"",secenekler:["","","",""],dogru:0,cevap:"",aciklama:"",ses:"",sesAd:""};
}
function topluAyristir(metin){
  metin=(metin||"").trim();
  if(!metin) return [];
  if(metin[0]==="["||metin[0]==="{"){                 // JSON
    try{
      const veri=JSON.parse(metin);
      return (Array.isArray(veri)?veri:veri.sorular||[]).map(temizle).filter(Boolean);
    }catch(e){bildir("JSON okunamadı.");return []}
  }
  const cikti=[];
  for(let ham of metin.split("\n")){
    ham=ham.trim(); if(!ham) continue;
    if(/^ses\s*:/i.test(ham)){                          // sesli
      const govde=ham.replace(/^ses\s*:/i,"").trim();
      const [sol,sag=""]=govde.split("::");
      if(!sol.trim()||!sag.trim()) continue;
      cikti.push(temizle({tip:"sesli",soru:sol.trim(),cevap:sag.split("|")[0].trim()}));
      continue;
    }
    if(ham.includes("::")){                            // sesli
      const [sol,sag=""]=ham.split("::");
      const p=sag.split("|").map(x=>x.trim());
      if(!sol.trim()||!p[0]) continue;
      cikti.push(temizle({tip:"sesli",soru:sol.trim(),cevap:p[0]}));
      continue;
    }
    const p=ham.split("|").map(x=>x.trim());
    if(p.length>=6){                                   // şıklı
      const harf=(p[5]||"A").toLocaleUpperCase("tr");
      const idx=Math.max(0,["A","B","C","D"].indexOf(harf));
      cikti.push(temizle({tip:"sikli",soru:p[0],secenekler:[p[1],p[2],p[3],p[4]],dogru:idx,
        kategori:p[6]||"",aciklama:p.slice(7).join(" | ")}));
    }
  }
  return cikti.filter(Boolean);
}
function turDuzelt(veri,ad){
  if(!veri||!/^data:/.test(veri)) return veri;
  const uzanti=String(ad||"").split(".").pop().toLowerCase();
  const dogru=SES_TURU[uzanti];
  const suanki=(veri.match(/^data:([^;,]*)/)||[])[1]||"";
  if(/^audio\/|^video\//.test(suanki)) return veri;
  return veri.replace(/^data:[^;,]*/,"data:"+(dogru||"audio/mpeg"));
}
function temizle(o){
  if(!o||!o.soru) return null;
  let tip=o.tip==="klasik"?"sesli":o.tip;
  if(!TIPLER[tip]) tip=(Array.isArray(o.secenekler)&&o.secenekler.filter(Boolean).length===4)?"sikli":"sesli";
  return {
    id:o.id||yeniId(), tip, kategori:(o.kategori||"").toString().trim(),
    soru:duzelt(o.soru),
    secenekler:tip==="sikli"?(o.secenekler||["","","",""]).map(x=>(x||"").toString().trim()):[],
    dogru:tip==="sikli"?Math.min(3,Math.max(0,+o.dogru||0)):0,
    cevap:tip==="sikli"?"":duzelt(o.cevap),
    aciklama:(o.aciklama||o.neden||"").toString().trim(),
    ses:turDuzelt(typeof o.ses==="string"?o.ses:"",o.sesAd), sesAd:(o.sesAd||"").toString(),
    yildizli:!!o.yildizli, eklendi:o.eklendi||Date.now()
  };
}

      <h2 class="baslik">⚠️ Tehlikeli Bölge</h2>
      <p style="color:var(--txt-3);margin:8px 0 16px;font-size:14.5px">Geri alınamaz.</p>
      <button class="btn kirmizi" id="hepsiniSil">🗑️ Tüm Soruları Sil</button>
    </div>
    <div class="kart">
      <h2 class="baslik">ℹ️ Depolama</h2>
      <p style="color:var(--txt-3);margin:8px 0 0;font-size:14.5px">${depoTipi} · ${sorular.length} soru · ${sesli} sesli</p>
      ${depoTipi==="Bellek"?`<p style="color:var(--yellow);margin:10px 0 0;font-size:13px;line-height:1.5">Bu ortamda kalıcı depolama kapalı — sorular sayfa kapanınca silinir. Dosyayı kendi sitenizde açtığınızda kalıcı olur.</p>`:""}
    </div>`;
}
function aktarBagla(){
  function indir(sesliDe){
    if(!sorular.length) return bildir("Aktarılacak soru yok.");
    const veri=sesliDe?sorular:sorular.map(s=>{const k=Object.assign({},s);k.ses="";k.sesAd="";return k});
    const blob=new Blob([JSON.stringify(veri,null,2)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="bilgi-yarismasi"+(sesliDe?"-sesli":"")+"-"+new Date().toISOString().slice(0,10)+".json";
    a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    bildir(sorular.length+" soru indirildi.");
  }
  $("#disaAktar").onclick=()=>indir(false);
  const ds=$("#disaAktarSes"); if(ds) ds.onclick=()=>indir(true);
  $("#iceAktar").onclick=()=>$("#dosya").click();
  $("#hepsiniSil").onclick=async()=>{
    if(!sorular.length) return bildir("Zaten boş.");
    if(!await onay(sorular.length+" sorunun tamamı kalıcı olarak silinecek. Geri alınamaz.","Hepsini sil")) return;
    await hepsiniSil(); sorular=[]; ciz(); bildir("Tüm sorular silindi.");
  };
}
$("#sesDosya").onchange=e=>{
  const f=e.target.files[0]; e.target.value="";
  if(!f) return;
  const mb=f.size/1048576;
  bildir("Ses okunuyor… "+mb.toFixed(1)+" MB");
  const r=new FileReader();
  r.onload=()=>{
    let veri=r.result;
    const uzanti=(f.name.split(".").pop()||"").toLowerCase();
    const dogruTur=SES_TURU[uzanti];
    const suanki=(veri.match(/^data:([^;,]*)/)||[])[1]||"";
    if(dogruTur&&suanki!==dogruTur) veri=veri.replace(/^data:[^;,]*/,"data:"+dogruTur);
    D.taslak.ses=veri;
    D.taslak.sesAd=f.name;
    D.taslak.sesBoyut=mb;
    icerikCiz();
    bildir("Ses eklendi: "+f.name);
  };
  r.onerror=()=>bildir("Dosya okunamadı. Başka bir dosya deneyin.");
  r.readAsDataURL(f);
};
$("#dosya").onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const okuyucu=new FileReader();
  okuyucu.onload=async()=>{
    const yeni=topluAyristir(okuyucu.result);
    if(!yeni.length){bildir("Dosyada geçerli soru yok.");return}
    const varOlan=new Map(sorular.map(s=>[s.soru,s]));
    let n=0,g=0;
    for(const y of yeni){
      const eski=varOlan.get(y.soru);
      if(eski){
        let degisti=false;
        if(y.ses&&!eski.ses){ eski.ses=y.ses; eski.sesAd=y.sesAd; degisti=true; }
        if(y.aciklama&&!eski.aciklama){ eski.aciklama=y.aciklama; degisti=true; }
        if(y.kategori&&!eski.kategori){ eski.kategori=y.kategori; degisti=true; }
        if(degisti){ await kaydet(eski); g++; }
        continue;
      }
      await kaydet(y); sorular.push(y); varOlan.set(y.soru,y); n++;
    }
    const atlanan=yeni.length-n-g;
    bildir(n+" yeni"+(g?", "+g+" güncellendi":"")+(atlanan>0?", "+atlanan+" zaten vardı":"")+".");
    ciz();
  };
  okuyucu.readAsText(f);
  e.target.value="";
};

/* ============================================================
   9. YARIŞMA EKRANI
   ============================================================ */
function oyunBaslat(){
  let liste=havuz();
  if(!liste.length) return bildir("Uygun soru yok.");
  if(D.ayar.karistir) liste=liste.map(s=>[Math.random(),s]).sort((a,b)=>a[0]-b[0]).map(p=>p[1]);
  liste=liste.slice(0,D.ayar.adet);
  D.oyun={liste,i:0,dogru:0,secilen:null,acik:false,neden:false,yanlislar:[],bitti:false};
  ciz(); window.scrollTo(0,0);
}
function oyunCiz(){
  const o=D.oyun;
  if(o.bitti) return sonucCiz();
  const s=o.liste[o.i];
  const yuzde=(o.i/o.liste.length)*100;
  let govde;
  if(s.tip==="sikli"){
    govde=["A","B","C","D"].map((h,i)=>{
      let durum="";
      if(o.secilen!==null){
        if(i===s.dogru) durum="dogru";
        else if(i===o.secilen) durum="yanlis";
        else durum="solgun";
      }
      return `<button class="sik" data-sec="${i}" data-durum="${durum}" ${o.secilen!==null?"disabled":""}>
        <span class="harf">${h}</span><span>${kacis(s.secenekler[i])}</span></button>`;
    }).join("");
  }else{
    if(!o.acik){
      govde=`<button class="btn bos-cerceve" id="cevabiAc">👁️ Cevabı göster</button>`;
    }else if(o.secilen===null){
      govde=`<div class="gizli-cevap">${kacis(s.cevap)}</div>
         <div class="ikili"><button class="btn bos-cerceve" data-oz="0">❌ Bilemedim</button>
         <button class="btn" data-oz="1" style="background:var(--green);color:#052A20">✅ Bildim</button></div>`;
    }else{
      govde=`<div class="gizli-cevap">${kacis(s.cevap)}</div>
        <p style="text-align:center;font-weight:700;color:${o.secilen===1?"var(--green)":"var(--red)"};margin:0">
          ${o.secilen===1?"✅ Bildiniz":"❌ Bilemediniz"}</p>`;
    }
  }

  return `<div class="oyun-ust">
      <button class="mini" id="cikBtn" aria-label="Yarışmadan çık">✕</button>
      <div class="ilerleme"><i style="width:${yuzde}%"></i></div>
      <span class="skor">${o.i+1}/${o.liste.length} · ${o.dogru}✓</span>
    </div>
    <div class="kart">
      <div class="soru-ust">
        <span class="rozet">${TIPLER[s.tip].ikon} ${TIPLER[s.tip].ad}</span>
        ${s.kategori?`<span class="rozet mor">${kacis(s.kategori)}</span>`:""}
        <button class="mini" data-yildizOyun="${s.id}" style="margin-left:auto" aria-label="Yıldızla">${s.yildizli?"⭐":"☆"}</button>
      </div>
      <p class="soru-metni">${kacis(s.soru)}</p>
      ${s.ses?`<button class="btn cal-btn" id="calBtn" style="margin:14px 0 2px">▶️ Sesi çal</button>`:""}
    </div>
    ${govde}
    ${o.secilen!==null&&s.tip!=="sesli"?`<div style="height:8px"></div>
      <button class="btn bos-cerceve" id="nedenBtn">💡 ${o.neden?"Açıklamayı gizle":"Neden?"}</button>
      ${o.neden?(s.aciklama
        ? `<div class="neden-kutu">${kacis(s.aciklama)}</div>`
        : `<div class="neden-kutu">
             <p style="margin:0 0 12px;color:var(--txt-2)">Bu soruya henüz açıklama yazılmamış. Şimdi yazarsanız soruya kalıcı olarak eklenir.</p>
             <textarea class="alan" id="nedenYaz" style="width:100%;min-height:92px;resize:vertical" placeholder="Cevap neden bu?"></textarea>
             <div style="height:10px"></div>
             <button class="btn" id="nedenKaydet">💾 Açıklamayı kaydet</button>
           </div>`):""}`:""}
    ${o.secilen!==null?`<div style="height:8px"></div><button class="btn" id="sonrakiBtn">${o.i+1<o.liste.length?"Sonraki soru →":"Sonuçları gör 🏁"}</button>`:""}`;
}
function sonucCiz(){
  const o=D.oyun, n=o.liste.length, yuzde=Math.round(o.dogru/n*100);
  const mesaj=yuzde>=90?"Kusursuza yakın.":yuzde>=70?"İyi iş.":yuzde>=40?"Fena değil, tekrar edelim.":"Bu konuyu bir daha çalışalım.";
  return `<div class="kart" style="padding:30px 20px">
      <div class="sonuc-yuzde">%${yuzde}</div>
      <div class="sonuc-alt">${n} sorudan ${o.dogru} doğru · ${mesaj}</div>
      <div class="ikili">
        <button class="btn bos-cerceve" id="bitirBtn">Bitir</button>
        <button class="btn" id="tekrarBtn">🔁 Tekrar oyna</button>
      </div>
      ${o.yanlislar.length?`<button class="btn sari" id="yanlisYildiz" style="margin-top:10px">⭐ Yanlışları yıldızla (${o.yanlislar.length})</button>`:""}
    </div>
    ${o.yanlislar.length?`<h2 class="baslik" style="margin:22px 4px 12px">Bilemedikleriniz</h2>`+o.yanlislar.map(soruKarti).join(""):""}`;
}
function oyunBagla(){
  const o=D.oyun;
  const cik=$("#cikBtn");
  if(cik) cik.onclick=()=>{try{speechSynthesis.cancel()}catch(e){} sesiDurdur(); D.oyun=null;ciz()};
  const cal=$("#calBtn");
  if(cal) cal.onclick=()=>sesOynat(o.liste[o.i].ses,cal);
  const ac=$("#cevabiAc");
  if(ac) ac.onclick=()=>{o.acik=true;icerikCiz()};

  document.querySelectorAll("[data-sec]").forEach(b=>b.onclick=()=>{
    const s=o.liste[o.i], i=+b.dataset.sec;
    o.secilen=i;
    if(i===s.dogru){o.dogru++;sesDogru()} else {o.yanlislar.push(s);sesYanlis()}
    icerikCiz();
  });
  document.querySelectorAll("[data-oz]").forEach(b=>b.onclick=()=>{
    const s=o.liste[o.i];
    o.secilen=+b.dataset.oz;
    if(o.secilen===1){o.dogru++;sesDogru()} else {o.yanlislar.push(s);sesYanlis()}
    icerikCiz();
  });
  document.querySelectorAll("[data-yildizOyun]").forEach(b=>b.onclick=async()=>{
    const s=sorular.find(x=>x.id===b.dataset.yildizoyun||x.id===b.getAttribute("data-yildizOyun"));
    if(!s) return;
    s.yildizli=!s.yildizli; await kaydet(s); icerikCiz();
  });
  const ned=$("#nedenBtn");
  if(ned) ned.onclick=()=>{o.neden=!o.neden;icerikCiz()};
  const nk=$("#nedenKaydet");
  if(nk) nk.onclick=async()=>{
    const metin=$("#nedenYaz").value.trim();
    if(!metin) return bildir("Açıklama boş olamaz.");
    const s=o.liste[o.i];
    s.aciklama=metin;
    const g=sorular.find(x=>x.id===s.id); if(g) g.aciklama=metin;
    await kaydet(g||s);
    bildir("Açıklama soruya eklendi.");
    icerikCiz();
  };
  const son=$("#sonrakiBtn");
  if(son) son.onclick=()=>{
    sesiDurdur();
    if(o.i+1<o.liste.length){o.i++;o.secilen=null;o.acik=false;o.neden=false;o.okundu=false;icerikCiz();window.scrollTo({top:0,behavior:"smooth"})}
    else {o.bitti=true;icerikCiz();window.scrollTo(0,0)}
  };
  document.querySelectorAll("[data-yildiz]").forEach(b=>b.onclick=async()=>{
    const s=sorular.find(x=>x.id===b.dataset.yildiz);
    if(!s) return; s.yildizli=!s.yildizli; await kaydet(s); icerikCiz();
  });
  document.querySelectorAll("[data-duzenle],[data-sil]").forEach(b=>b.style.display="none");
  const bit=$("#bitirBtn"); if(bit) bit.onclick=()=>{D.oyun=null;D.sekme="sorular";ciz()};
  const tek=$("#tekrarBtn"); if(tek) tek.onclick=oyunBaslat;
  const yy=$("#yanlisYildiz");
  if(yy) yy.onclick=async()=>{
    for(const s of o.yanlislar){const g=sorular.find(x=>x.id===s.id);if(g&&!g.yildizli){g.yildizli=true;await kaydet(g)}}
    bildir("Yanlışlar yıldızlandı."); ciz();
  };
  // ayar açıksa soruyu cihaz okusun
  if(D.ayar.oku&&o&&!o.bitti&&o.secilen===null&&!o.okundu){
    o.okundu=true; setTimeout(()=>konus(o.liste[o.i].soru),300);
  }
}

/* ============================================================
   10. ÇİZİM DÖNGÜSÜ
   ============================================================ */
function icerikCiz(){
  const k=$("#icerik");
  if(D.oyun){ k.innerHTML=oyunCiz(); oyunBagla(); return; }
  if(D.sekme==="sorular"){ k.innerHTML=sorularCiz(); sorularBagla(); }
  else if(D.sekme==="yildizli"){ k.innerHTML=yildizliCiz(); yildizliBagla(); }
  else if(D.sekme==="ekle"){ k.innerHTML=ekleCiz(); ekleBagla(); }
  else if(D.sekme==="yarisma"){ k.innerHTML=yarismaCiz(); yarismaBagla(); }
  else { k.innerHTML=aktarCiz(); aktarBagla(); }
}
function ciz(){
  if(D.oyun){ $("#cerceve").innerHTML=""; icerikCiz(); return; }
  cerceveCiz(); icerikCiz();
}
